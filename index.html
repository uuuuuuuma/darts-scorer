<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Darts Scorer</title>
<meta name="description" content="01・クリケット対応のダーツスコアカウンター（80%/100%スタッツ、履歴、DARTSLIVEアワード対応）" />
<link rel="icon" href="data:,">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0F1B15; }
  #root { min-height: 100dvh; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // ---- localStorage-backed replacement for the Claude-artifact "window.storage" API ----
  // Same shape as the artifact persistent-storage API, so the component code needs no changes.
  window.storage = {
    async get(key, shared) {
      const raw = window.localStorage.getItem(key);
      if (raw === null) throw new Error("key not found: " + key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      window.localStorage.setItem(key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      window.localStorage.removeItem(key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const keys = Object.keys(window.localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: !!shared };
    },
  };
</script>

<script type="text/babel" data-presets="react" src="./app.jsx"></script>
<script type="text/babel" data-presets="react">
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<DartsScorer />);
</script>
</body>
</html>
